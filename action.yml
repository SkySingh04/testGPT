name: 'Keploy TestGPT'
description: "TestGPT is a GitHub Action designed to execute Keploy test cases and generate detailed test reports."
author: Sonichigo
branding:
  icon: 'aperture'
  color: 'orange'

inputs:
  working-directory:
    description: Relative path under $GITHUB_WORKSPACE where the repository was checked out
    required: true
  command:
    description: Command to run the application
    required: true
  keploy-path:
    description: Path to keploy
    required: true
    default: ./
  delay:
    description: Time to start application
    required: true
    default: 10
  container-name:
    description: Name of the container in case of "docker compose" command
  build-delay:
    description: Time to wait for docker container build
    default: 50s
  github-token:
    description: GitHub token for PR interactions
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Setup GITHUB_PATH for script
      run: |
        echo "${{ github.action_path }}" >> $GITHUB_PATH
        echo "${{ inputs.working-directory }}"
      shell: bash
      
    - name: Grant permissions to scripts
      run: |
        chmod +x ${GITHUB_ACTION_PATH}/install.sh
        chmod +x ${GITHUB_ACTION_PATH}/detect-languages.sh
        chmod +x ${GITHUB_ACTION_PATH}/analyze-code.sh
        chmod +x ${GITHUB_ACTION_PATH}/parse-results.sh
      shell: bash
      
    - id: keploy-test-report
      name: Run Keploy Tests
      run: ${GITHUB_ACTION_PATH}/install.sh > ${GITHUB_WORKSPACE}/${WORKDIR}/report.txt
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        DELAY: ${{ inputs.delay }}
        COMMAND: ${{ inputs.command }}
        KEPLOY_PATH: ${{inputs.keploy-path}}

    - name: Parse Test Results
      id: parse-results
      run: ${GITHUB_ACTION_PATH}/parse-results.sh
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        
    - name: Fetch PR changes
      id: pr-files
      uses: actions/github-script@v6
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            const response = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const files = response.data.map(file => file.filename);
            core.setOutput('files', files.join(','));
            return files;
          } catch (error) {
            core.setFailed(`Failed to fetch PR files: ${error.message}`);
          }

    - name: Detect languages
      id: language-detection
      run: ${GITHUB_ACTION_PATH}/detect-languages.sh
      shell: bash
      
    - name: Run code analysis
      run: ${GITHUB_ACTION_PATH}/analyze-code.sh
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        DETECTED_LANGUAGES: ${{ steps.language-detection.outputs.languages }}
        PR_FILES: ${{ steps.pr-files.outputs.files }}

    - name: Check if report is generated
      run: |
        if [ -s ${GITHUB_WORKSPACE}/${WORKDIR}/final.out ]; then
          echo "Report generated successfully."
        else
          echo "Error: Report not generated." >&2
          exit 1
        fi
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        
    - name: Comment on PR
      if: success()
      uses: actions/github-script@v6
      env:
        KEPLOY_REPORT: ${{ steps.parse-results.outputs.KEPLOY_REPORT }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          if (!process.env.KEPLOY_REPORT) {
            console.error('Error: KEPLOY_REPORT not found.');
            process.exit(1);
          }
          
          const fs = require('fs');
          const path = require('path');
          
          function readReport(filepath) {
            try {
              return fs.readFileSync(filepath, 'utf8');
            } catch (error) {
              return null;
            }
          }
          
          const reportsDir = path.join('${{ inputs.working-directory }}', 'analysis-reports');
          const reports = fs.readdirSync(reportsDir)
            .filter(file => file.endsWith('.txt') || file.endsWith('.xml'))
            .map(file => readReport(path.join(reportsDir, file)))
            .filter(Boolean);
          
          const summary = `## 📊 TestGPT Analysis Report
          
          ${process.env.KEPLOY_REPORT || 'No test results available'}
          
          ${reports.join('\n\n')}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          })