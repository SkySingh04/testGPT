name: Run test-cases

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  my_job:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Keploy Report
      uses: keploy/testgpt@main
      with:
        working-directory: ${{ github.workspace }}
        delay: 10
        command: node src/app.js
        keploy-path: .